name: APK
on:
  workflow_dispatch:
    inputs:
      release:
        description: "APK'yi GitHub Release olarak yayinla"
        type: boolean
        default: false
  push:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: bash ytfolder.sh
      - run: sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Imza anahtari (GitHub Secret)
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
            echo "HAS_KEY=1" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret yok; gecici anahtar kullanilacak, guncellemeler ustune kurulmaz."
          fi
      - run: cd android && chmod +x gradlew && (./gradlew assembleDebug || (rm -f ~/.android/debug.keystore && ./gradlew assembleDebug))
      - name: Sabit anahtarla imzala ve dogrula
        if: env.HAS_KEY == '1'
        run: |
          APKSIGNER="$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner"
          cd android/app/build/outputs/apk/debug
          "$APKSIGNER" sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out imzali.apk app-debug.apk
          mv -f imzali.apk app-debug.apk
          "$APKSIGNER" verify --print-certs app-debug.apk | tee /tmp/cert.txt
          grep -qi 276991337252db94ab9565cb3f703aab523f2f971e36410142475c19f83e8a7d /tmp/cert.txt || (echo "IMZA YANLIS: sabit anahtar uygulanmadi" && exit 1)
      - name: APK adini surumle
        run: |
          VER="$(grep -o "APP_VER='[^']*'" www/app.html | head -1 | cut -d"'" -f2)"
          [ -n "$VER" ] || (echo "APP_VER bulunamadi" && exit 1)
          NAME="Yatirim Takip_v${VER}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/$NAME"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "ART_NAME=yatirim-apk-v${VER}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART_NAME }}
          path: android/app/build/outputs/apk/debug/${{ env.APK_NAME }}
      - name: Surum yayini (yalnizca elle + release isaretliyse)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F="android/app/build/outputs/apk/debug/${APK_NAME}"
          gh release view "v${VER}" >/dev/null 2>&1 || gh release create "v${VER}" --title "v${VER}" --notes "Yatirim Takip v${VER}"
          gh release upload "v${VER}" "$F" --clobber

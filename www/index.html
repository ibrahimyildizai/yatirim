<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yatırım Takip</title>
<style>
:root{--bg:#0f1419;--c:#1a222c;--t:#e8edf2;--m:#8a97a6;--a:#3ddc97;--r:#ff6b6b;--b:#2a7fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 80px}
.w{padding:12px}.card{background:var(--c);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:17px}h3{margin:10px 0 4px;font-size:13px;color:var(--m)}
input,select{width:100%;padding:11px;margin:4px 0 8px;border-radius:10px;border:1px solid #2f3b49;background:#0f1419;color:var(--t);font-size:15px}
label{font-size:12px;color:var(--m)}
button{background:var(--b);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;margin:4px 4px 0 0}
button.g{background:#2f3b49}button.d{background:#6b2b2b}
.row{display:flex;gap:8px}.row>*{flex:1}
.up{color:var(--a)}.dn{color:var(--r)}.m{color:var(--m);font-size:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#141b23;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;margin:0;padding:10px 2px;font-size:11px;color:var(--m)}nav button.on{color:var(--a)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 3px;text-align:right;border-bottom:1px solid #2a3542}td:first-child,th:first-child{text-align:left}
</style></head><body><script>window.onerror=function(m,u,l){document.body.insertAdjacentHTML("afterbegin","<pre style=\"color:#ff6b6b;white-space:pre-wrap;padding:12px\">HATA: "+m+" (satır "+l+")</pre>")}</script><div class="w" id="v">Yükleniyor…</div><script>(function(){var v=document.getElementById("v");function s(t){v.textContent=t}window.__s=s;s("1) JS tamam");window.addEventListener("error",function(e){if(e.message)s("HATA: "+e.message+" @"+e.lineno)},true);window.addEventListener("unhandledrejection",function(e){s("SOZ HATASI: "+e.reason)});document.addEventListener("securitypolicyviolation",function(e){s("CSP: "+e.violatedDirective)})})()</script><nav id="n"></nav>
<script>
window.__s&&window.__s('2) ana kod basladi');
const K='yt1';
let S=JSON.parse(localStorage.getItem(K)||'null')||{
rates:{usd:0,eur:0,gold:0,silver:0,t:''},
funds:[
{id:1,n:'Emlak Katılım Fon Havuzu',s:'2025-02-25',e:'2025-05-27',a:15000,p:1026.31,r0:{gold:3509.63,usd:36.54,eur:38.39},r1:{gold:4240.80,usd:38.98,eur:44.49}},
{id:2,n:'Hesap 699958-1163',s:'2026-10-05',e:'2027-01-05',a:10000,p:null,r0:null,r1:null}],
assets:[],snaps:[],per:7};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const $=i=>document.getElementById(i);
const num=v=>parseFloat(String(v).replace(',','.'));
const f=(n,d=2)=>isFinite(n)?Number(n).toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d}):'-';
const day=s=>new Date(s);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const pc=n=>`<span class="${n>=0?'up':'dn'}">${n>=0?'▲':'▼'} %${f(Math.abs(n))}</span>`;
const nowS=()=>new Date().toLocaleString('tr-TR');

async function getRates(d){
 const v=d||'latest';
 const us=[`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${v}/v1/currencies/usd.json`,`https://${v}.currency-api.pages.dev/v1/currencies/usd.json`];
 for(const u of us){try{const j=(await(await fetch(u)).json()).usd;
  return{usd:j.try,eur:j.try/j.eur,gold:1/j.xau/31.1035*j.try,silver:1/j.xag/31.1035*j.try};}catch(e){}}
 throw new Error('kur');}
async function getR(){try{const r=await getRates();S.rates=Object.assign({},r,{t:nowS()});save();render()}catch(e){alert('Kurlar alınamadı. İnterneti kontrol edin veya elle girin.')}}

// ortalama günlük getiri (sonuçlanmış kayıtlardan)
function fd(){const c=S.funds.filter(x=>x.p!=null);if(!c.length)return 0;
 return c.reduce((s,x)=>s+x.p/x.a/((day(x.e)-day(x.s))/864e5),0)/c.length}

const V={};
// ---------- FON ----------
function fcard(x){
 const days=Math.round((day(x.e)-day(x.s))/864e5),done=x.p!=null;
 let h=`<div class="card"><b>${x.n||'Fon'}</b><br><span class="m">${x.s} → ${x.e} (${days} gün)</span><br>Yatırım: ${f(x.a)} TL`;
 if(!done){h+=`<br>⏳ Aktif — vadeye ${Math.max(0,Math.ceil((day(x.e)-Date.now())/864e5))} gün<br><button onclick="fin(${x.id})">Sonuçlandır</button>`}
 else{const t=x.p/x.a*100;
  h+=`<br>Kâr: <b class="up">${f(x.p)} TL</b> ${pc(t)}<br><span class="m">Haftalık %${f(t/days*7)} · Aylık %${f(t/days*30.4)} · Yıllık %${f(t/days*365)} (basit)</span>`;
  if(x.r1)h+=`<br><span class="m">Kâr karşılığı: ${f(x.p/x.r1.gold,3)} gr / ${f(x.p/x.r1.usd)} $ / ${f(x.p/x.r1.eur)} €</span>`;
  if(x.r0&&x.r1){
   const c=[['Fon',t],['Altın',(x.r1.gold/x.r0.gold-1)*100],['Dolar',(x.r1.usd/x.r0.usd-1)*100],['Euro',(x.r1.eur/x.r0.eur-1)*100]];
   const b=Math.max(...c.map(v=>v[1]));
   h+=`<h3>Aynı dönemde getiri</h3>`+c.map(v=>`<div>${v[1]==b?'🏆 ':'&nbsp;&nbsp;&nbsp;&nbsp;'}${v[0]}: ${pc(v[1])}</div>`).join('')}}
 if(!x.r0)h+=`<br><button class="g" onclick="kur(${x.id})">Başlangıç kurunu getir</button>`;
 return h+`<br><button class="d" onclick="delF(${x.id})">Sil</button></div>`}
V.fon=()=>{const d=fd();
 return `<div class="card"><h2>📊 Fon özeti</h2>`+(d?`3 aylık ort. getiri: <b>%${f(d*91*100)}</b><br>Aylık: %${f(d*30.4*100)} · Haftalık: %${f(d*7*100)}<br>Yıllık (3 ayda bir yeniden yatırım): %${f((Math.pow(1+d*91,4)-1)*100)}<p class="m">Geçmiş kayıtların ortalamasıdır, garanti değildir.</p>`:'Sonuçlanmış kayıt yok')+`</div>
<div class="card"><h2>➕ Yeni fon kaydı</h2>
<input id="fn" placeholder="Ad / not (ör. hesap no)">
<div class="row"><div><label>Başlangıç</label><input id="fs" type="date" value="${today()}"></div><div><label>Vade</label><input id="fe" type="date"></div></div>
<label>Tutar (TL)</label><input id="fa" inputmode="decimal">
<label>Kâr (TL) — vade dolduysa; boşsa aktif sayılır</label><input id="fp" inputmode="decimal">
<button onclick="addF()">Kaydet</button></div>`+[...S.funds].sort((a,b)=>b.s>a.s?1:-1).map(fcard).join('')};
async function addF(){
 const a=num($('fa').value),s=$('fs').value,e=$('fe').value;
 if(!a||!s||!e)return alert('Tutar, başlangıç ve vade tarihi gerekli');
 const pv=$('fp').value.trim();
 const x={id:Date.now(),n:$('fn').value,s,e,a,p:pv===''?null:num(pv),r0:null,r1:null};
 try{x.r0=await getRates(s<today()?s:undefined)}catch(_){}
 if(x.p!=null)try{x.r1=await getRates(e<today()?e:undefined)}catch(_){}
 S.funds.push(x);save();render()}
async function kur(id){const x=S.funds.find(v=>v.id==id);try{x.r0=await getRates(x.s<today()?x.s:undefined);save();render()}catch(_){alert('Alınamadı')}}
async function fin(id){const x=S.funds.find(v=>v.id==id),p=num(prompt('Elde edilen kâr (TL)?')||'');
 if(isNaN(p))return;x.p=p;if(x.e>today())x.e=today();
 try{x.r1=await getRates(x.e<today()?x.e:undefined)}catch(_){}save();render()}
function delF(id){if(confirm('Silinsin mi?')){S.funds=S.funds.filter(v=>v.id!=id);save();render()}}

// ---------- HESAPLA ----------
V.calc=()=>{setTimeout(calc,0);return `<div class="card"><h2>🧮 Kazanç hesaplayıcı</h2>
<label>Yatırılacak tutar (TL)</label><input id="ca" inputmode="decimal" value="10000" oninput="calc()">
<label>Vade (ay)</label><input id="cm" inputmode="decimal" value="3" oninput="calc()">
<label>Elle 3 aylık getiri % (boşsa kayıtlardan ortalama)</label><input id="cr" inputmode="decimal" oninput="calc()">
<div id="co"></div></div><div class="card"><h2>Hızlı tablo (3 ay)</h2><div id="ct"></div></div>`};
function calc(){
 const a=num($('ca').value)||0,m=num($('cm').value)||3,r3=$('cr').value?num($('cr').value)/100:fd()*91;
 if(!r3){$('co').innerHTML='<p class="m">Önce Fon sekmesine sonuçlanmış kayıt ekleyin veya oran girin.</p>';return}
 const days=m*30.4,p=a*(r3/91)*days,t=a+p,Q=S.rates;
 $('co').innerHTML=`Kâr: <b class="up">${f(p)} TL</b><br>Toplam: <b>${f(t)} TL</b><br><span class="m">Haftalık ort. ${f(p/days*7)} TL · Aylık ${f(p/days*30.4)} TL</span><br>`+
 (Q.gold?`<span class="m">Toplam karşılığı: ${f(t/Q.gold,3)} gr altın / ${f(t/Q.usd)} $ / ${f(t/Q.eur)} €</span><br>`:'')+
 `<span class="m">Yıllık (3 ayda bir anapara+kâr yeniden yatırılırsa): ${f(a*Math.pow(1+r3,4))} TL</span>`;
 $('ct').innerHTML=`<table><tr><th>Tutar</th><th>Kâr</th><th>Toplam</th></tr>`+[10000,15000,25000,50000,100000].map(v=>`<tr><td>${f(v,0)}</td><td class="up">${f(v*r3)}</td><td>${f(v*(1+r3))}</td></tr>`).join('')+`</table>`}

// ---------- VARLIK ----------
const TY={gold:'Altın (gr)',silver:'Gümüş (gr)',usd:'Dolar ($)',eur:'Euro (€)',try:'TL'};
const px=t=>t=='try'?1:(S.rates[t]||0);
V.ast=()=>{let tot=0,cost=0;
 const rows=S.assets.map((x,i)=>{const v=x.m*px(x.t);tot+=v;cost+=x.c||0;
  return `<div class="card"><b>${TY[x.t]}</b>: ${f(x.m,x.t=='gold'||x.t=='silver'?3:2)}<br>Anlık değer: <b>${f(v)} TL</b>`+(x.c?`<br>Maliyet ${f(x.c)} TL · ${pc((v/x.c-1)*100)} (${f(v-x.c)} TL)`:'')+`<br><button class="d" onclick="delA(${i})">Sil</button></div>`}).join('');
 return `<div class="card"><h2>🪙 Toplam varlık</h2><b style="font-size:22px">${f(tot)} TL</b>`+(cost?`<br><span class="m">Maliyetli kalemlerin toplamı: ${f(cost)} TL</span>`:'')+(S.rates.usd?'':'<p class="dn">Önce Kurlar sekmesinden kurları çekin.</p>')+`</div>
<div class="card"><h2>➕ Varlık ekle</h2><select id="at">${Object.entries(TY).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
<label>Miktar</label><input id="am" inputmode="decimal"><label>Toplam alış maliyeti TL (isteğe bağlı)</label><input id="ac" inputmode="decimal">
<button onclick="addA()">Ekle</button></div>`+rows};
function addA(){const m=num($('am').value);if(!m)return;S.assets.push({t:$('at').value,m,c:num($('ac').value)||0});save();render()}
function delA(i){if(confirm('Silinsin mi?')){S.assets.splice(i,1);save();render()}}

// ---------- TAKİP ----------
const PL={7:'Haftada bir',15:'15 günde bir',30:'Ayda bir',91:'3 ayda bir'};
function stats(){
 const sn=S.snaps,l=sn[sn.length-1],d=fd();if(!l)return '';
 const W=[[7,'Haftalık'],[30,'Aylık'],[365,'Yıllık']],names=['Fon','Altın','Gümüş','Dolar','Euro'];
 const cols=W.map(([w])=>{
  const lim=new Date(day(l.d)-w*864e5).toISOString().slice(0,10);
  const b=[...sn].reverse().find(s=>s.d<=lim);if(!b)return null;
  const n=(day(l.d)-day(b.d))/864e5;
  return [d*n*100,(l.gold/b.gold-1)*100,(l.silver/b.silver-1)*100,(l.usd/b.usd-1)*100,(l.eur/b.eur-1)*100]});
 return `<div class="card"><h2>📈 İstatistik</h2><table><tr><th></th>${W.map(w=>`<th>${w[1]}</th>`).join('')}</tr>`+
 names.map((nm,i)=>`<tr><td>${nm}</td>`+cols.map(c=>{if(!c)return '<td>-</td>';const m=Math.max(...c);
  return `<td class="${c[i]==m?'up':''}">${c[i]==m?'🏆':''}${f(c[i])}%</td>`}).join('')+`</tr>`).join('')+
 `</table><p class="m">🏆 = o dönemin en verimlisi. Sütunlar yeterli kayıt biriktikçe dolar. Fon değeri, ortalama günlük getiriden hesaplanır.</p></div>`}
V.trk=()=>{const sn=S.snaps,l=sn[sn.length-1];let due='Henüz kayıt yok';
 if(l){const n=new Date(day(l.d).getTime()+S.per*864e5),left=Math.ceil((n-Date.now())/864e5);
  due=`Son kayıt: ${l.d}<br>Sonraki güncelleme: ${n.toISOString().slice(0,10)} — `+(left<=0?'<b class="dn">zamanı geldi!</b>':`${left} gün kaldı`)}
 return `<div class="card"><h2>⏱ Güncelleme sıklığı</h2><select onchange="S.per=+this.value;save();render()">${Object.entries(PL).map(([k,v])=>`<option value="${k}" ${k==S.per?'selected':''}>${v}</option>`).join('')}</select><p>${due}</p><button onclick="snap()">Kurları çek ve kayıt al</button></div>`+stats()+
 (sn.length?`<div class="card"><h2>Son kayıtlar</h2><table><tr><th>Tarih</th><th>Altın</th><th>$</th><th>€</th><th>Gümüş</th></tr>`+[...sn].reverse().slice(0,10).map(s=>`<tr><td>${s.d}</td><td>${f(s.gold)}</td><td>${f(s.usd)}</td><td>${f(s.eur)}</td><td>${f(s.silver)}</td></tr>`).join('')+`</table></div>`:'')};
async function snap(){try{const r=await getRates();S.rates=Object.assign({},r,{t:nowS()});
 S.snaps=S.snaps.filter(s=>s.d!=today());S.snaps.push(Object.assign({d:today()},r));S.snaps.sort((a,b)=>a.d>b.d?1:-1);save();render()}
 catch(e){alert('Kurlar alınamadı')}}

// ---------- KURLAR ----------
V.krl=()=>`<div class="card"><h2>💱 Kurlar (TL)</h2><p class="m">Son güncelleme: ${S.rates.t||'-'}<br>Altın/gümüş uluslararası fiyattan hesaplanır; kuyumcu/banka fiyatından biraz farklı olabilir. Dilerseniz elle düzeltin.</p>`+
 [['gold','Gram altın'],['silver','Gram gümüş'],['usd','Dolar'],['eur','Euro']].map(([k,n])=>`<label>${n}</label><input inputmode="decimal" value="${S.rates[k]?(+S.rates[k]).toFixed(2):''}" onchange="S.rates.${k}=num(this.value);save()">`).join('')+
 `<button onclick="getR()">Kurları internetten çek</button></div>`;

// ---------- ÇATI ----------
const TABS=[['fon','💰','Fon'],['calc','🧮','Hesapla'],['ast','🪙','Varlık'],['trk','📈','Takip'],['krl','💱','Kurlar']];
let tab='fon';
function render(){$('v').innerHTML=V[tab]();
 $('n').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}<br>${t[2]}</button>`).join('');window.scrollTo(0,0)}
window.__s&&window.__s('3) render oncesi');
render();
if(!S.rates.usd)getRates().then(r=>{S.rates=Object.assign({},r,{t:nowS()});save();render()}).catch(()=>{});
</script></body></html>

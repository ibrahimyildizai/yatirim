function calc(){
 if(!$('co'))return;
 const a=num($('ca').value)||0,m=num($('cm').value)||3,Q=S.rates,P=S.past,days=m*30.4;
 const rf=$('cr').value?num($('cr').value)/100:fd()*91,rows=[];
 if(rf)rows.push(['Fon','',a*(rf/91)*days]);
 [['gold','cg','Altın',' gr',3],['silver','cs','Gümüş',' gr',3],['usd','cu','Dolar',' $',2],['eur','ce','Euro',' €',2]].forEach(x=>{
  const k=x[0];if(!Q[k])return;
  const r=$(x[1]).value?num($(x[1]).value)/100:(P&&P[k]&&P.now?P.now[k]/P[k]-1:null);if(r==null||isNaN(r))return;
  rows.push([x[2],f(a/(Q[k+'S']||Q[k]),x[4])+x[3],a*(Math.pow(1+r,days/91)-1)])});
 if(!rows.length){$('co').innerHTML='<p class="m">Hesap için Fon kaydı ekleyin ya da Ayarlar sekmesinden kurları çekin.</p>';$('ct').innerHTML='';return}
 const best=Math.max(...rows.map(x=>x[2]));
 $('co').innerHTML=`<h2>${f(a,0)} TL, ${f(m,0)} ay sonra (tahmini)</h2><table><tr><th>Araç</th><th>Getiri</th><th>Kâr</th><th>Toplam</th></tr>`+
 rows.map(x=>`<tr><td>${x[2]==best?'🏆 ':''}${x[0]}<br><span class="m">${x[1]}</span></td><td>${pc(x[2]/a*100)}</td><td class="${x[2]>=0?'up':'dn'}">${f(x[2])}</td><td>${f(a+x[2])}</td></tr>`).join('')+
 `</table><p class="m">Altın, gümüş, dolar ve euro tahmini son 91 günün gerçek değişimine (ya da elle girdiğin %'ye) dayanır. Gelecek garanti değildir. 🏆 en yüksek tahmini kâr.</p>`+
 (rf?`<p class="m">Fon yıllık (her 3 ayda anapara+kâr yeniden): ${f(a*Math.pow(1+rf,4))} TL</p>`:'');
 $('ct').innerHTML=rf?`<table><tr><th>Tutar</th><th>Kâr</th><th>Toplam</th></tr>`+[10000,15000,25000,50000,100000].map(v=>`<tr><td>${f(v,0)}</td><td class="up">${f(v*rf)}</td><td>${f(v*(1+rf))}</td></tr>`).join('')+`</table>`:'-'}

V.ast=()=>{let tot=0,cost=0,pl=0,gg=0,gc=0;

  if(x.t!='try'&&u>0&&cp>0){const c=x.m*u,d=v-c;cost+=c;pl+=d;if(x.t=='gold'){gg+=x.m;gc+=c}
   h+=`<br>Alış tutarı${x.d?' ('+x.d+')':''}: <b>${f(c)} TL</b><br><span class="m">${x.d?wk(x.d)+' · ':''}Birim alış: ${f(u)} TL → Güncel: ${f(cp)} TL (birim başı)</span><br>${d>=0?'Kâr':'Zarar'}: <b class="${d>=0?'up':'dn'}">${f(Math.abs(d))} TL</b> ${pc((cp/u-1)*100)}`}
  else if(x.t!='try')h+=`<br><span class="m">Alış fiyatı girilmemiş</span>`;
  return h+`<br><button class="g" onclick="editA(${i})">Alış fiyatını düzenle</button><button class="d" onclick="delA(${i})">Sil</button></div>`}).join('');
 const gp=S.rates.gold,gavg=gg?gc/gg:0;
 return `<div class="card"><h2>Toplam varlık</h2><b style="font-size:22px">${f(tot)} TL</b>`+(cost?`<br>Alışı girilenlerde: <b class="${pl>=0?'up':'dn'}">${pl>=0?'Kâr':'Zarar'} ${f(Math.abs(pl))} TL</b> ${pc(pl/cost*100)}<br><span class="m">Toplam maliyet ${f(cost)} TL</span>`:'')+(gg&&gp?`<h3>Altın özeti</h3><div>${f(gg,3)} gr · ort. alış ${f(gavg)} TL/gr · güncel ${f(gp)} TL/gr</div><div>Alıştaki toplam tutar: <b>${f(gc)} TL</b> → şimdiki değer: <b>${f(gg*gp)} TL</b></div><div class="${gp>=gavg?'up':'dn'}">Altında ${gp>=gavg?'kâr':'zarar'}: <b>${f(Math.abs(gg*gp-gc))} TL</b> ${pc((gp/gavg-1)*100)}</div>`:'')+(S.rates.usd?'':'<p class="dn">Kurlar henüz alınamadı.</p>')+`</div>

let lockA=false,lastA='',lastAt=0;

 const t=$('at').value,d=$('ad').value,sig=[t,m,d,$('au').value,$('ac').value].join('|');
 const ub=num($('au').value);if(S.assets.some(y=>y.t==t&&y.m==m&&(y.d||'')==(d||'')&&(!(ub>0)||Math.abs((y.u||0)-ub)<1e-9))&&!confirm('Aynı türde, miktarda ve tarihte bir kayıt zaten var.\n\nYine de ikinci kez eklemek ister misin?'))return;
 lockA=true;if(bt){bt.disabled=true;bt.textContent='Ekleniyor…'}
 const x={t,m,d:d||'',u:0,c:0};let u=num($('au').value),c=num($('ac').value);
 if(!(u>0)&&c>0)u=c/m;
 if(!(u>0)&&d&&t!='try'){try{u=(await getRates(d<today()?d:undefined))[t]}catch(e){lockA=false;if(bt){bt.disabled=false;bt.textContent='Ekle'}return alert('Bu tarihin fiyatı alınamadı. Birim alış fiyatını elle yaz.')}}
 if(u>0){x.u=u;x.c=m*u}
 lastA=sig;lastAt=Date.now();S.assets.push(x);save();clrD(['am','ac','ad','au']);lockA=false;render();toast('Varlık eklendi ✓')}

 let dl=null;if(g.d)dl=Math.round((new Date(g.d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
 return{T:T,C:C,rem:rem,pct:pct,r:(k=='try'?fd()*30.4:0),en:(k=='try'?(S.ind.enfY||0)/100:0),dl:dl,W:W,auto:auto,pe:pe,sc:gScale(),k:k,px:px,pb:gPb(g)}}

function empParse(tx){const o={},m=(r,i)=>{const x=tx.match(r);return x?x[i||1]:null},num2=v=>parseFloat(String(v).replace(',','.'));
 const dt=v=>{const p=v.split('.');return p[2]+'-'+p[1]+'-'+p[0]};
 let v;

 if(v=m(/H[İI]ZMETE\s*BA[ŞS]LAMA[\s\S]{0,40}?(\d{2}\.\d{2}\.\d{4})/i))o.start=dt(v);
 if(v=m(/TESC[İI]L\s*BA[ŞS]LANG[İI][ÇC][\s\S]{0,25}?(\d{2}\.\d{2}\.\d{4})/i))o.tescil=dt(v);

 if(ya){const t=pdt(today());let nv=null;const y=+ya[1],mo=+ya[2],d=+ya[3];
  for(let k=-3;k<=3&&!nv;k++){const c=addDay(new Date(t.getFullYear()-y,t.getMonth()-mo,t.getDate()),-d+k);const r=ymd(c,t);if(r[0]==y&&r[1]==mo&&r[2]==d)nv=c}
  o.birth=iso(nv||addDay(new Date(t.getFullYear()-y,t.getMonth()-mo,t.getDate()),-d))}
 const am=tx.match(/(\d{2})\/(\d{2})\/(\d{4})[”"'“]?\s*Tarihi\s*[İI]t[İI]bar[ıi]yla[\s\S]{0,30}?Hesaplanan\s*Ayl[ıi]k\s*([\d.,]+)/i);
 if(am){o.payD=am[3]+'-'+am[2]+'-'+am[1];o.aylik=num2(am[4])}
 const kv=[['ek',/Ek\s*[ÖO]deme\s*([\d.,]+)/i],['ortY',/Ortalama\s*Y[ıi]ll[ıi]k\s*Kazan[çc]\s*([\d.,]+)/i],['ort',/Ortalama\s*Ayl[ıi]k\s*Kazan[çc]\s*([\d.,]+)/i],['o2',/Ayl[ıi]k\s*Ba[ğg]lanma\s*Oran[ıi]\s*2\s*([\d.,]+)/i],['o3',/Ayl[ıi]k\s*Ba[ğg]lanma\s*Oran[ıi]\s*3\s*([\d.,]+)/i],
  ['p1',/2000\s*[ÖO]ncesi[\s\S]{0,40}?G[üu]n\s*Say[ıi]s[ıi]\s*(\d+)/i],['p2',/2000-2008\/10\s*Aras[ıi][\s\S]{0,40}?G[üu]n\s*Say[ıi]s[ıi]\s*(\d+)/i],['p3',/2008\/10\s*Sonras[ıi][\s\S]{0,40}?G[üu]n\s*Say[ıi]s[ıi]\s*(\d+)/i]];
 kv.forEach(a=>{const x=tx.match(a[1]);if(x)o[a[0]]=num2(x[1])});
 if(o.aylik==null){const x=tx.match(/Hesaplanan\s*Ayl[ıi]k\s*([\d.,]+)/i);if(x)o.aylik=num2(x[1])}
 if(!o.prim&&(v=m(/Toplam\s*Prim\s*G[üu]n\s*Say[ıi]s[ıi][\s\S]{0,40}?G[üu]n\s*Say[ıi]s[ıi]\s*(\d+)/i)))o.prim=+v;
 o.paths=[];
 if(/EMEKL[İI]L[İI]K\s*[ŞS]ARTLARI/i.test(tx)){const ag=tx.match(/YA[ŞS]I\s*KALAN\s*YA[ŞS]\s*(\d{2})\s*YA[ŞS]/i),dg=tx.match(/G[ÜU]N\s*SAYISI\s*KALAN\s*G[ÜU]N\s*(\d{3,5})/i),sg=tx.match(/S[İI]GORTALILIK\s*S[ÜU]RES[İI]\s*KALAN\s*S[ÜU]RE\s*(\d{1,2})\s*YIL/);
  if(ag&&dg){const A=+ag[1],Dd=+dg[1],Sg=sg?+sg[1]:0;o.paths.push({n:A+' yaş + '+Dd+' gün'+(Sg?' + '+Sg+' yıl sigortalılık':''),age:A,days:Dd,sig:Sg})}}

  if(navigator.share){await navigator.share({title:'Fon kayıtları',text:t});return}}catch(e){if(isCan(e))return}
 copyT(t)}
async function fonTxt(){const t=fonText(),d=new Date(),name='fon-kayitlari-'+today()+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'.txt',p=YF();
 if(p){toast('Kaydedilecek klasörü seç');try{const r=await p.pick();await p.write({uri:r.uri,name:name,data:t,mime:'text/plain'});toast('Kaydedildi: '+fName({name:r.name||''})+'/'+name);return}catch(e){if(isCan(e))return;alert('Klasöre yazılamadı: '+(e&&e.message||e)+'\n\nBaşka bir klasör seçmeyi dene (ör. Belgeler).')}}
 try{if(isP('Filesystem')&&isP('Share')){const P=Capacitor.Plugins,r=await P.Filesystem.writeFile({path:name,data:t,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:name,files:[r.uri],dialogTitle:'Nereye kaydedelim?'});return}
  if(navigator.share&&window.File){await navigator.share({files:[new File([t],name,{type:'text/plain'})],title:name});return}}catch(e){if(isCan(e))return}
 copyT(t)}

function pickBackup(){let i=$('bkf');if(!i){i=document.createElement('input');i.type='file';i.id='bkf';i.style.display='none';
 i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(String(r.result));if(!o.funds)throw 0;applyJ(JSON.stringify(o))}catch(e){alert('Bu dosya bir Yatırım Takip yedeği değil.')}i.value=''};r.readAsText(f)};document.body.appendChild(i)}i.click()}
const ACC={blue:['Mavi','#2a7fff'],green:['Yeşil','#1fae6b'],purple:['Mor','#8b5cf6'],orange:['Turuncu','#f08c1b'],pink:['Pembe','#e5509a'],teal:['Turkuaz','#14b8c4']};
function applyTheme(){let m=S.th.m;if(m=='auto')m=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
 document.documentElement.setAttribute('data-theme',m);document.documentElement.style.setProperty('--b',(ACC[S.th.c]||ACC.blue)[1])}
function setTh(m){S.th.m=m;save();render()}
function setAcc(c){S.th.c=c;save();render()}
function clrHist(){HS={U:[],R:[]};persist();render()}
function resetAll(){if(!confirm('TÜM veriler sıfırlansın mı?'))return;if(!confirm('Emin misin? Yedekler silinmez, ayrıca Geri düğmesiyle dönebilirsin.'))return;
 HS.U.push(cur);if(HS.U.length>20)HS.U.shift();HS.R=[];S=norm();cur=JSON.stringify(S);persist();render();schedNotif()}

// ---------- ÇATI ----------
const NAV=[['por','Portföy',[['fon','Fon'],['ast','Varlık']]],['pln','Planla',[['hed','Hedefler'],['calc','Hesapla'],['zek','Zekât']]],['bil','Bilgi',[['bil','Genel'],['asg','Asgari ücret']]],['emg','Emeklilik',[['emk','Özet'],['emy','Ne zaman?'],['emm','Maaş'],['emv','Güncelle']]],['ayr','Ayarlar',[['krl','Ayarlar']]]];
const gOf=t=>NAV.find(g=>g[2].some(s=>s[0]==t))||NAV[0];
const LASTG=Object.assign({},UP.lg||{});let tab=(UP.tab&&NAV.some(g=>g[2].some(x=>x[0]==UP.tab)))?UP.tab:'fon';
function subnav(){const g=gOf(tab);if(g[2].length<2)return '';return `<div class="chips">`+g[2].map(s=>`<button class="${s[0]==tab?'on':''}" onclick="go('${s[0]}')">${s[1]}</button>`).join('')+`</div>`}
function hdr(){return `<div class="bar"><button class="g" onclick="undo()" ${HS.U.length?'':'disabled'}>◀ Geri (${HS.U.length})</button><button class="g" onclick="redo()" ${HS.R.length?'':'disabled'}>İleri (${HS.R.length}) ▶</button></div>
<div class="m" style="padding:5px 2px 0">${busy?'<b class="up" style="font-size:14px">Güncelleniyor…</b>':'Kurlar: '+(S.rates.t||'alınamadı')+' · '+srcText(S.rates.src)}${err&&!busy?' · alınamadı, son değerler (ayrıntı: Ayarlar → Kurlar nereden geliyor?)':''}<br>Aşağı çekerek güncelle</div>`}const OFF=[[0,'Vade günü'],[1,'1 gün önce'],[3,'3 gün önce'],[7,'7 gün önce']];
const LN=()=>{try{return window.Capacitor&&Capacitor.isPluginAvailable&&Capacitor.isPluginAvailable('LocalNotifications')?Capacitor.Plugins.LocalNotifications:null}catch(e){return null}};
let ntCount=0;
async function schedNotif(){const p=LN();if(!p)return;
 try{const pe=await p.getPending();if(pe.notifications&&pe.notifications.length)await p.cancel({notifications:pe.notifications});
  ntCount=0;if(!S.nt.on)return;const st=await p.checkPermissions();if(st.display!='granted')return;
  const tm=(S.nt.t||'09:00').split(':').map(Number),now=Date.now(),list=[];let id=1;
  S.funds.filter(x=>x.p==null&&!x.o).forEach(x=>{S.nt.off.forEach(k=>{const d=new Date(x.e+'T00:00:00');d.setDate(d.getDate()-k);d.setHours(tm[0]||0,tm[1]||0,0,0);
   if(d.getTime()>now+60000)list.push({id:id++,title:k?'Fon vadesine '+k+' gün kaldı':'Fon vadesi geldi',body:(x.n||'Fon')+' · '+f(x.a)+' TL · vade '+x.e,schedule:{at:d,allowWhileIdle:true}})})});
  if(list.length)await p.schedule({notifications:list});ntCount=list.length}catch(e){}}
async function ntRefresh(){const e=$('ntst');if(!e)return;const p=LN();
 if(!p){e.innerHTML='Bu APK sürümünde telefon bildirimi yok. Şimdilik vade uyarısı, uygulamayı açtığında en üstte gösterilir. Telefon bildirimi için APK\'yı bir kez yenilemen gerekir.';return}
 try{const s=await p.checkPermissions();e.innerHTML=s.display=='granted'?`Telefon bildirimi <b class="up">hazır</b> · ${ntCount} bildirim planlı`:'Bildirim izni verilmemiş. <b>Bildirim izni iste</b>ye dokun. Daha önce reddettiysen Telefon Ayarları → Uygulamalar → Yatırım Takip → Bildirimler\'den aç.'}catch(x){e.textContent='Bildirim durumu okunamadı'}}
async function ntAsk(){const p=LN();if(!p)return alert('Bu APK sürümünde bildirim eklentisi yok. Uygulama açıkken vade uyarısı üstte gösterilir.');
 try{const r=await p.requestPermissions();await schedNotif();render();toast(r.display=='granted'?'Bildirim izni verildi ✓':'İzin verilmedi')}catch(e){toast('İzin istenemedi')}}
async function ntTest(){const p=LN();if(!p)return toast('Bu sürümde telefon bildirimi yok');
 try{const s=await p.checkPermissions();if(s.display!='granted')return toast('Önce bildirim izni ver');
  await p.schedule({notifications:[{id:999,title:'Test bildirimi',body:'Yatırım Takip bildirimleri çalışıyor',schedule:{at:new Date(Date.now()+5000)}}]});toast('Test bildirimi 5 saniye içinde gelecek')}catch(e){toast('Test gönderilemedi')}}
function ntOff(k,c){const a=new Set(S.nt.off);if(c)a.add(k);else a.delete(k);S.nt.off=[...a].sort((x,y)=>x-y);save();render()}
function dueBanner(){if(!S.nt.on)return '';const mx=Math.max(0,...S.nt.off),now=new Date();now.setHours(0,0,0,0);
 const L=S.funds.filter(x=>x.p==null&&!x.o).map(x=>({x:x,d:Math.round((new Date(x.e+'T00:00:00')-now)/864e5)})).filter(o=>o.d<=mx).sort((a,b)=>a.d-b.d);
 if(!L.length)return '';
 return `<div class="card" style="border:1px solid ${L[0].d<=0?'#ff6b6b':'#e0b341'}"><b>Fon vadesi</b>`+L.map(o=>`<div style="margin-top:6px">${o.d<0?`<span class="dn">Vadesi ${-o.d} gün geçti</span>`:o.d==0?'<span class="dn">Bugün vade günü</span>':`<span style="color:#e0b341">${o.d} gün kaldı</span>`} · ${esc(o.x.n||'Fon')} · ${f(o.x.a)} TL · ${o.x.e}<br><button class="g" style="padding:6px 10px;font-size:13px" onclick="fin(${o.x.id})">Sonuçlandır</button></div>`).join('')+`</div>`}
function indic(){const mg=localStorage.getItem('app_msg');
 return dueBanner()+(S.first&&tab=='krl'?`<div class="card" style="border:1px solid var(--b)"><b>Yeni kurulum</b><div class="m" style="font-size:13px;margin:6px 0">Daha önce yedek dosyası kaydettiysen şimdi yükleyebilirsin.</div><button onclick="pickBackup()">Yedek dosyasını seç</button><button class="g" onclick="S.first=false;save(true);render()">Sonra yükle</button></div>`:'')+(mg?`<div class="card"><span class="dn">${mg}</span><br><button class="g" onclick="localStorage.removeItem('app_msg');render()">Tamam</button></div>`:'')}
function render(){applyTheme();$('h').innerHTML=hdr();$('v').innerHTML=subnav()+indic()+V[tab]();
 $('n').innerHTML=NAV.map(g=>`<button class="${g===gOf(tab)?'on':''}" onclick="goG('${g[0]}')">${g[1]}</button>`).join('');wkp();zhp();restD()}
function go(t){tab=t;LASTG[gOf(t)[0]]=t;upSave();render();window.scrollTo(0,0)}
function goG(id){const g=NAV.find(x=>x[0]==id);go(LASTG[id]||g[2][0][0])}
document.addEventListener('visibilitychange',()=>{if(document.hidden){save(true);persist()}else{backup();if(!S.rates.ts||Date.now()-S.rates.ts>3e5)refresh(true)}});
window.addEventListener('pagehide',()=>{save(true);persist()});
setInterval(backup,6e4);
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(S.th.m=='auto')applyTheme()})}catch(e){}
let py=null,pd=0;
function ptr(t){const e=$('pt');if(!e)return;e.textContent=t;e.style.display=t?'block':'none'}
document.addEventListener('touchstart',e=>{py=(window.scrollY<=0&&e.touches.length==1)?e.touches[0].clientY:null;pd=0},{passive:true});
document.addEventListener('touchmove',e=>{if(py==null)return;pd=e.touches[0].clientY-py;ptr(pd>90?'Bırak, güncellensin ↓':(pd>12?'Güncellemek için çek ↓':''))},{passive:true});
document.addEventListener('touchend',()=>{const go=py!=null&&pd>90;py=null;pd=0;ptr('');if(go)refresh(false)});
let scT;window.addEventListener('scroll',()=>{clearTimeout(scT);scT=setTimeout(()=>{UP.sy=Math.round(window.scrollY||0);UP.syt=tab;try{localStorage.setItem(KU,JSON.stringify(UP))}catch(e){}},500)},{passive:true});
backup();render();
if(UP.syt==tab&&UP.sy>0)setTimeout(()=>window.scrollTo(0,UP.sy),80);
try{localStorage.setItem('app_new','0');localStorage.removeItem('app_try')}catch(e){}/*YT-OK*/
schedNotif();refresh(true);
</script></body></html>
